name: skinguard_ai
description: Offline AI skin lesion screening
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  onnxruntime: ^1.4.1
  image: ^4.2.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0

  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.2

  crypto: ^3.0.5
  shared_preferences: ^2.3.3

  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
